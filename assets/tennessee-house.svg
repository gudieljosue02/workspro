<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A common single-story brick home in Tennessee">
  <!-- Sky -->
  <rect width="800" height="600" fill="#DCE5F3"/>
  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="140" cy="90" rx="52" ry="18"/>
    <ellipse cx="180" cy="78" rx="38" ry="14"/>
    <ellipse cx="640" cy="70" rx="60" ry="18"/>
    <ellipse cx="690" cy="58" rx="36" ry="13"/>
  </g>
  <!-- Lawn -->
  <rect y="440" width="800" height="160" fill="#A3BF8F"/>
  <rect y="440" width="800" height="14" fill="#93B27F"/>

  <!-- Tree (left) -->
  <rect x="82" y="330" width="20" height="120" rx="4" fill="#6E5442"/>
  <circle cx="92" cy="280" r="66" fill="#7FA46B"/>
  <circle cx="52" cy="316" r="44" fill="#8BB077"/>
  <circle cx="136" cy="312" r="46" fill="#749961"/>

  <!-- Chimney -->
  <rect x="560" y="182" width="44" height="110" fill="#9C5F4B"/>
  <rect x="554" y="174" width="56" height="14" fill="#8A5240"/>

  <!-- Roof (gable) -->
  <path d="M120 318 L400 168 L680 318 Z" fill="#3E434D"/>
  <path d="M100 318 L400 158 L700 318 L700 332 L400 176 L100 332 Z" fill="#23262C"/>

  <!-- House body: brick -->
  <rect x="150" y="318" width="500" height="142" fill="#A5674F"/>
  <!-- Brick texture (subtle courses) -->
  <g stroke="#8F573F" stroke-width="2" opacity="0.5">
    <line x1="150" y1="342" x2="650" y2="342"/>
    <line x1="150" y1="366" x2="650" y2="366"/>
    <line x1="150" y1="390" x2="650" y2="390"/>
    <line x1="150" y1="414" x2="650" y2="414"/>
    <line x1="150" y1="438" x2="650" y2="438"/>
  </g>

  <!-- Gable siding -->
  <path d="M400 190 L560 318 L240 318 Z" fill="#F6F7F9"/>
  <g stroke="#DDE0E5" stroke-width="3">
    <line x1="330" y1="262" x2="470" y2="262"/>
    <line x1="300" y1="286" x2="500" y2="286"/>
    <line x1="272" y1="310" x2="528" y2="310"/>
  </g>
  <!-- Gable vent -->
  <circle cx="400" cy="238" r="16" fill="#3E434D"/>
  <circle cx="400" cy="238" r="10" fill="#F6F7F9"/>

  <!-- Porch roof -->
  <path d="M330 318 L400 288 L470 318 L470 330 L330 330 Z" fill="#23262C"/>
  <!-- Porch columns -->
  <rect x="336" y="330" width="12" height="130" fill="#FFFFFF"/>
  <rect x="452" y="330" width="12" height="130" fill="#FFFFFF"/>

  <!-- Front door (brand blue) -->
  <rect x="372" y="352" width="56" height="108" rx="3" fill="#26539E"/>
  <rect x="380" y="362" width="40" height="42" rx="2" fill="#1E4483"/>
  <circle cx="420" cy="414" r="4" fill="#F5B400"/>
  <!-- Porch step -->
  <rect x="360" y="460" width="80" height="10" fill="#C7CBD2"/>

  <!-- Windows with shutters -->
  <g>
    <rect x="188" y="352" width="26" height="74" fill="#3E434D"/>
    <rect x="290" y="352" width="26" height="74" fill="#3E434D"/>
    <rect x="218" y="352" width="68" height="74" fill="#FFFFFF"/>
    <rect x="224" y="358" width="56" height="62" fill="#DCE5F3"/>
    <line x1="252" y1="358" x2="252" y2="420" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="224" y1="389" x2="280" y2="389" stroke="#FFFFFF" stroke-width="4"/>
  </g>
  <g>
    <rect x="484" y="352" width="26" height="74" fill="#3E434D"/>
    <rect x="586" y="352" width="26" height="74" fill="#3E434D"/>
    <rect x="514" y="352" width="68" height="74" fill="#FFFFFF"/>
    <rect x="520" y="358" width="56" height="62" fill="#DCE5F3"/>
    <line x1="548" y1="358" x2="548" y2="420" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="520" y1="389" x2="576" y2="389" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Bushes -->
  <circle cx="200" cy="452" r="26" fill="#749961"/>
  <circle cx="248" cy="456" r="20" fill="#8BB077"/>
  <circle cx="552" cy="456" r="20" fill="#8BB077"/>
  <circle cx="600" cy="452" r="26" fill="#749961"/>

  <!-- Walkway -->
  <path d="M372 470 L428 470 L468 600 L332 600 Z" fill="#F6F7F9"/>
  <path d="M372 470 L428 470 L468 600 L332 600 Z" fill="none" stroke="#DDE0E5" stroke-width="3"/>

  <!-- Mailbox -->
  <rect x="700" y="420" width="8" height="46" fill="#6E5442"/>
  <rect x="688" y="404" width="34" height="20" rx="8" fill="#3E434D"/>
</svg>
